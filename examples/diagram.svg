  <rect x="630" y="120" width="210" height="230" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#subtleShadow)"/>
  <rect x="630" y="120" width="210" height="40" rx="10" fill="#F1F5F9"/>
